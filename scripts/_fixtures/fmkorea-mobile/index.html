<!doctype html>
<html lang="ko" data-test-status="running">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FM코리아 모바일 유저스크립트 브라우저 회귀 검사</title>
  <style>
    body { margin: 20px; font: 14px/1.5 system-ui, sans-serif; color: #182230; }
    h1 { margin: 0 0 8px; font-size: 21px; }
    p { margin: 0 0 14px; }
    #summary { margin: 12px 0; font-weight: 700; }
    #results { padding-left: 22px; }
    #results li { margin: 5px 0; }
    .pass { color: #08722b; }
    .fail { color: #b42318; }
    .fixture { display: inline-block; vertical-align: top; margin: 8px; }
    .fixture h2 { margin: 0 0 4px; font-size: 13px; }
    .fixture iframe { display: block; width: 390px; height: 190px; border: 1px solid #aab; }
  </style>
</head>
<body>
  <h1>FM코리아 모바일 유저스크립트 회귀 검사</h1>
  <p>저장소 루트에서 <code>python3 -m http.server 8765</code> 실행 후 <code>/scripts/_fixtures/fmkorea-mobile/</code>를 엽니다.</p>
  <div id="summary">검사 준비 중…</div>
  <ol id="results"></ol>
  <div id="frames"></div>
  <script>
    (async () => {
      const SOURCE_URL = '/p/hidden-memo/tampermonkey/userscripts/fmkorea-mobile.user.js';
      const results = document.querySelector('#results');
      const summary = document.querySelector('#summary');
      const frames = document.querySelector('#frames');
      const IMAGE = 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=';
      const WHITE_IMAGE = 'data:image/svg+xml;base64,' + btoa(
        '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><rect width="128" height="128" fill="white"/></svg>');
      const DARK_IMAGE = 'data:image/svg+xml;base64,' + btoa(
        '<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128"><rect width="128" height="128" fill="#202020"/></svg>');
      const delay = ms => new Promise(resolve => setTimeout(resolve, ms));
      let passed = 0;
      let failed = 0;

      function record(label, ok, detail = '') {
        const row = document.createElement('li');
        row.className = ok ? 'pass' : 'fail';
        row.textContent = `${ok ? 'PASS' : 'FAIL'} · ${label}${detail ? ` — ${detail}` : ''}`;
        results.append(row);
        if (ok) passed++;
        else failed++;
        summary.textContent = `${passed} PASS · ${failed} FAIL`;
      }

      function escapeScript(source) {
        return source.replace(/<\/script/gi, '<\\/script');
      }

      function adProof(name, kind) {
        if (kind === 'form') {
          const payload = `a:2:{s:7:"channel";s:13:"m_fmkorea.ch2";s:13:"random_string";s:${name.length}:"${name}";}`;
          return `<form id="${name}_form"><input type="hidden" name="${name}" value="${btoa(payload)}"></form>`;
        }
        const css = `<link rel="stylesheet" disabled href="https://static.fmkorea.com/${name}.css?fixture=1">`;
        const js = kind === 'pair'
          ? `<script type="application/json" src="https://static.fmkorea.com/${name}.js?fixture=1"><\/script>`
          : '';
        return css + js;
      }

      function boardMarkup() {
        return `<div class="bd bd_mobile" id="real-board">
          <div class="bd_lst_wrp"><p id="plain-text">실제 게시판 글은 보여야 합니다.</p>
          <img id="normal-image" src="${IMAGE}" width="12" height="12" alt="일반 이미지"></div>
        </div>`;
      }

      function childHtml(source, name, kind, withSlot) {
        const settings = { header: false, appearance: false };
        const slot = withSlot ? `<div id="ad-slot" class="${name}" style="height:150px">광고 슬롯</div>` : '';
        const css = `body .${name} { display:block!important; position:relative; height:150px!important;
          min-height:150px!important; border-top:1px solid #aaa; border-bottom:1px solid #aaa; }`;
        // 외부 리소스는 식별용 DOM 노드입니다. CSP가 다운로드와 실행을 모두 막습니다.
        return `<!doctype html><html lang="ko"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
          <script>window.GM_getValue=(_key,fallback)=>Object.assign({},fallback,${JSON.stringify(settings)});
            window.GM_setValue=()=>{};<\/script>
          <script>${escapeScript(source)}<\/script>
          ${adProof(name, kind)}
          <style>body{margin:0;background:#fff;color:#111;font:15px system-ui}
            .hd{height:32px;background:#dde8f2}.bd{padding:10px;border-top:1px solid #ccc}
            #normal-image{display:inline-block;vertical-align:middle}${css}</style>
        </head><body><header class="hd">상단 로고</header>${slot}${boardMarkup()}</body></html>`;
      }

      async function makeFrame(source, label, name, kind = 'pair', withSlot = true) {
        const box = document.createElement('section');
        box.className = 'fixture';
        const title = document.createElement('h2');
        title.textContent = label;
        const frame = document.createElement('iframe');
        frame.title = label;
        frame.srcdoc = childHtml(source, name, kind, withSlot);
        box.append(title, frame);
        frames.append(box);
        await Promise.race([
          new Promise((resolve, reject) => {
            frame.addEventListener('load', resolve, { once: true });
            frame.addEventListener('error', () => reject(new Error('iframe load error')), { once: true });
          }),
          delay(4000).then(() => { throw new Error('iframe load timeout'); })
        ]);
        await delay(60);
        return frame.contentDocument;
      }

      function isParked(element) {
        if (!element) return false;
        const style = element.ownerDocument.defaultView.getComputedStyle(element);
        return element.hasAttribute('data-fm-clean-ad-original') &&
          style.position === 'absolute' && style.visibility === 'hidden' &&
          element.getBoundingClientRect().height === 0;
      }

      function contentVisible(doc) {
        const board = doc.querySelector('#real-board');
        const text = board?.querySelector('#plain-text');
        const image = board?.querySelector('#normal-image');
        return Boolean(text && image && board &&
          board.getBoundingClientRect().height > 0 && text.getBoundingClientRect().height > 0 &&
          image.getBoundingClientRect().height > 0 &&
          doc.defaultView.getComputedStyle(text).visibility === 'visible');
      }

      function toggleAds(doc, checked) {
        const host = doc.querySelector('#fm-clean-controls');
        const shadow = host?.shadowRoot;
        const launcher = shadow?.querySelector('.launcher');
        const input = shadow?.querySelector('input[name="ads"]');
        if (!launcher || !input) throw new Error('설정 버튼 또는 광고 토글 없음');
        launcher.dispatchEvent(new doc.defaultView.KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
        input.checked = checked;
        input.dispatchEvent(new doc.defaultView.Event('change', { bubbles: true }));
      }

      // 상세 화면은 기존 목록 광고 fixture와 독립적으로 문서 시작 시점부터 스크립트를 실행합니다.
      async function makeDetailFrame(source, label, settings = {}, boardSource = 'heading') {
        const box = document.createElement('section');
        box.className = 'fixture';
        const heading = document.createElement('h2');
        heading.textContent = label;
        const frame = document.createElement('iframe');
        frame.title = label;
        const boardHeading = boardSource === 'heading'
          ? '<div class="tl_srch"><div class="bd_tl"><h1><a href="/football_world">해외축구</a></h1></div></div>'
          : '';
        const activeMenu = boardSource === 'menu'
          ? '<nav class="fmkorea_navi"><a href="/humor">유머</a><a class="on" href="/football_world">해외축구</a></nav>'
          : '';
        const pageTitle = boardSource === 'title' ? '상세 글 - 해외축구 - 에펨코리아' : '상세 글 - 에펨코리아';
        frame.srcdoc = `<!doctype html><html lang="ko"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
          <title>${pageTitle}</title>
          <script>window.GM_getValue=(_key,fallback)=>Object.assign({},fallback,${JSON.stringify(settings)});
            window.GM_setValue=()=>{};<\/script>
          <script>${escapeScript(source)}<\/script>
          <style>body{margin:0;background:#fff;color:#111;font:15px system-ui}
            .hd{height:32px;background:#dde8f2}.bd{padding:10px;border-top:1px solid #ccc}
            .rd_hd h1{margin:8px 0}.rd_body{min-height:40px}</style>
          </head><body><header class="hd">상단 로고</header>
          <div id="detail-board" class="bd bd_mobile">${activeMenu}${boardHeading}
            <div class="rd"><div class="rd_hd"><div class="top_area">
              <h1 class="np_18px"><span class="np_18px_span">상세 제목</span></h1>
            </div><div class="btm_area"><div class="side"><a class="member_plate" href="#author">작성자</a>
              <span>추천 수 <b>238</b></span></div></div></div>
              <div class="rd_body"><article id="detail-content">실제 글 내용</article></div>
              <div class="fm_vote"><div class="vote"><span class="new_voted_count">238</span></div></div>
            </div></div></body></html>`;
        box.append(heading, frame);
        frames.append(box);
        await Promise.race([
          new Promise((resolve, reject) => {
            frame.addEventListener('load', resolve, { once: true });
            frame.addEventListener('error', () => reject(new Error('detail iframe load error')), { once: true });
          }),
          delay(4000).then(() => { throw new Error('detail iframe load timeout'); })
        ]);
        await delay(60);
        return frame.contentDocument;
      }

      function detailLauncher(doc) {
        return doc.querySelector('#fm-clean-controls')?.shadowRoot?.querySelector('.launcher');
      }

      function detailOption(doc, key, checked) {
        const shadow = doc.querySelector('#fm-clean-controls')?.shadowRoot;
        const launcher = shadow?.querySelector('.launcher');
        const input = shadow?.querySelector(`input[name="${key}"]`);
        if (!launcher || !input) return false;
        launcher.dispatchEvent(new doc.defaultView.KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
        input.checked = checked;
        input.dispatchEvent(new doc.defaultView.Event('change', { bubbles: true }));
        return true;
      }

      function detailChip(doc) {
        return doc.querySelector('.rd > .rd_hd .btm_area [data-fm-clean-board]');
      }

      function detailCount(doc) {
        return doc.querySelector('.rd > .rd_hd h1 > [data-fm-clean-badge]');
      }

      function visiblyRendered(element) {
        if (!element?.isConnected) return false;
        const style = element.ownerDocument.defaultView.getComputedStyle(element);
        return style.display !== 'none' && style.visibility !== 'hidden' &&
          element.getBoundingClientRect().height > 0;
      }

      // 사이트 CSS와 늦게 채워지는 메뉴를 함께 재현합니다. 스크립트는 문서 시작에 배치합니다.
      async function makeLayoutFrame(source, label, body, css = '', settings = {}, gmOptions = {}) {
        const box = document.createElement('section');
        box.className = 'fixture';
        const heading = document.createElement('h2');
        heading.textContent = label;
        const frame = document.createElement('iframe');
        frame.title = label;
        const readHistoryKey = 'pimi.fmkorea.read-history.v1';
        const storedHistory = Object.hasOwn(gmOptions, 'history')
          ? JSON.stringify(gmOptions.history) : 'undefined';
        const captureFilters = gmOptions.captureFilters
          ? `<script>window.__fmInitialFilters=Object.fromEntries(${JSON.stringify(gmOptions.captureFilters)}
              .map(id=>[id,getComputedStyle(document.getElementById(id)).filter]));<\/script>` : '';
        const captureBoot = gmOptions.captureBoot
          ? `<script>window.__fmBootCapture={
              opacity:getComputedStyle(document.body).opacity,
              pointerEvents:getComputedStyle(document.body).pointerEvents,
              background:getComputedStyle(document.documentElement).backgroundColor,
              boot:document.documentElement.getAttribute('data-fm-clean-boot')};<\/script>` : '';
        const trackProbes = gmOptions.trackProbes ? `<script>(()=>{
          const NativeImage=window.Image;
          const descriptor=Object.getOwnPropertyDescriptor(HTMLImageElement.prototype,'src');
          const stats=window.__fmProbeStats={count:0,active:0,max:0,urls:[]};
          window.Image=function(...args){
            const image=new NativeImage(...args);
            let busy=false;
            const done=()=>{if(busy){busy=false;stats.active--;}};
            image.addEventListener('load',done);image.addEventListener('error',done);
            Object.defineProperty(image,'src',{configurable:true,
              get(){return descriptor.get.call(image)},
              set(value){
                done();busy=true;stats.count++;stats.active++;
                stats.max=Math.max(stats.max,stats.active);stats.urls.push(String(value));
                descriptor.set.call(image,value);
              }});
            return image;
          };
          window.Image.prototype=NativeImage.prototype;
        })();<\/script>` : '';
        frame.srcdoc = `<!doctype html><html lang="ko"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
          <title>레이아웃 회귀 검사 - 에펨코리아</title>
          <script>window.__fmSettingsFixture={value:${JSON.stringify(settings)},writes:[]};
            window.__fmReadFixture={value:${storedHistory},writes:[],listeners:[],failWrites:${Boolean(gmOptions.failWrites)}};
            window.GM_getValue=(key,fallback)=>key===${JSON.stringify(readHistoryKey)}
              ? (window.__fmReadFixture.value===undefined?fallback:window.__fmReadFixture.value)
              : Object.assign({},fallback,window.__fmSettingsFixture.value);
            window.GM_setValue=(key,value)=>{if(key!==${JSON.stringify(readHistoryKey)}){
                const saved=JSON.parse(JSON.stringify(value));window.__fmSettingsFixture.value=saved;
                window.__fmSettingsFixture.writes.push(saved);return;}
              if(window.__fmReadFixture.failWrites)throw new Error('fixture storage write failure');
              const old=window.__fmReadFixture.value;
              const saved=JSON.parse(JSON.stringify(value));window.__fmReadFixture.value=saved;
              window.__fmReadFixture.writes.push(saved);
              window.__fmReadFixture.listeners.forEach(listener=>listener(key,old,saved,false));};
            window.GM_addValueChangeListener=(key,listener)=>{
              if(key===${JSON.stringify(readHistoryKey)})window.__fmReadFixture.listeners.push(listener);
              return window.__fmReadFixture.listeners.length;};<\/script>
          ${trackProbes}
          <script>${escapeScript(source)}<\/script>
          <style>body{margin:0;background:#fff;color:#111;font:15px system-ui}
            .hd{height:32px;background:#dde8f2}.bd{padding:10px;border-top:1px solid #ccc}
            ${css}</style>
          </head><body class="${gmOptions.bodyClass || ''}">${body}${captureFilters}${captureBoot}</body></html>`;
        box.append(heading, frame);
        frames.append(box);
        await Promise.race([
          new Promise((resolve, reject) => {
            frame.addEventListener('load', resolve, { once: true });
            frame.addEventListener('error', () => reject(new Error('layout iframe load error')), { once: true });
          }),
          delay(4000).then(() => { throw new Error('layout iframe load timeout'); })
        ]);
        await delay(80);
        return frame.contentDocument;
      }

      function firstLineCenter(element) {
        const rect = element.getBoundingClientRect();
        const lineHeight = Number.parseFloat(element.ownerDocument.defaultView.getComputedStyle(element).lineHeight);
        return rect.top + Math.min(lineHeight || rect.height, rect.height) / 2;
      }

      try {
        const response = await fetch(SOURCE_URL, { cache: 'no-store' });
        if (!response.ok) throw new Error(`유저스크립트 요청 ${response.status}`);
        const source = await response.text();
        if (!source.includes('==UserScript==')) throw new Error('유저스크립트 내용 확인 실패');

        const names = ['aBcDe', 'lCjAtSkuCmf', 'QaBcDeFgHiJkL', 'AaBbCcDdEeFfGgHhIiJj'];
        for (const name of names) {
          const doc = await makeFrame(source, `${name.length}자 CSS·JS 광고`, name);
          record(`${name.length}자 광고 슬롯 숨김`, isParked(doc.querySelector('#ad-slot')) && contentVisible(doc),
            `class=${name}, header=false`);
        }

        const formName = 'FmAdFormAbC';
        const formDoc = await makeFrame(source, 'hidden form 광고', formName, 'form');
        record('PHP channel/random_string 폼으로 광고 식별',
          isParked(formDoc.querySelector('#ad-slot')) && contentVisible(formDoc));

        const ordinary = await makeFrame(source, '일반 CSS 단독', 'OrdinaryStyle', 'css-only');
        const ordinarySlot = ordinary.querySelector('#ad-slot');
        record('일반 루트 CSS 단독은 숨기지 않음', Boolean(ordinarySlot &&
          ordinarySlot.getBoundingClientRect().height >= 150 &&
          !ordinarySlot.hasAttribute('data-fm-clean-ad-original') && contentVisible(ordinary)));

        const cloneName = 'lCjAtSkuCmf';
        const cloneDoc = await makeFrame(source, '실제 목록 복제 광고', cloneName, 'pair', false);
        const realBoard = cloneDoc.querySelector('#real-board');
        const clone = realBoard.cloneNode(true);
        clone.id = 'ad-clone';
        clone.classList.add(cloneName);
        clone.insertAdjacentHTML('afterbegin', '<p>가짜 광고 링크</p>');
        realBoard.before(clone);
        await delay(60);
        record('게시판 목록 복제→광고 class→광고 문구 삽입',
          isParked(clone) && contentVisible(cloneDoc) &&
          cloneDoc.querySelector('#real-board') === realBoard);

        const detachName = 'DetachAdOne';
        const detachDoc = await makeFrame(source, '광고 노드 재삽입', detachName);
        const detached = detachDoc.querySelector('#ad-slot');
        const initiallyParked = isParked(detached);
        detached.remove();
        await delay(120);
        detached.removeAttribute('class');
        detached.removeAttribute('id');
        detachDoc.querySelector('#real-board').before(detached);
        await delay(60);
        record('광고 detach 120ms→class/id 제거→재삽입',
          initiallyParked && isParked(detached) && contentVisible(detachDoc));

        detached.remove();
        await delay(120);
        toggleAds(detachDoc, false);
        detachDoc.querySelector('#real-board').before(detached);
        await delay(60);
        record('광고 OFF 중 재삽입하면 원래 표시 상태로 복원',
          detached.getBoundingClientRect().height >= 150 &&
          !detached.hasAttribute('data-fm-clean-ad-original') && contentVisible(detachDoc));

        const toggleName = 'ToggleAdName';
        const toggleDoc = await makeFrame(source, '광고 OFF/ON 복원', toggleName);
        const toggled = toggleDoc.querySelector('#ad-slot');
        const beforeToggle = isParked(toggled);
        toggled.removeAttribute('class');
        toggled.removeAttribute('id');
        await delay(30);
        toggleAds(toggleDoc, false);
        await delay(30);
        const offStyle = toggleDoc.defaultView.getComputedStyle(toggled);
        const restored = offStyle.position !== 'absolute' && offStyle.visibility === 'visible' &&
          toggled.getBoundingClientRect().height >= 150 &&
          !toggled.hasAttribute('data-fm-clean-ad-original');
        toggleAds(toggleDoc, true);
        await delay(30);
        record('class/id 변경 후 광고 OFF 복원·ON 재숨김',
          beforeToggle && restored && isParked(toggled) && contentVisible(toggleDoc));

        const detailDoc = await makeDetailFrame(source, '상세 제목 게시판 배지·설정',
          { boardLabel: true, count: true });
        const titleHeading = detailDoc.querySelector('.rd > .rd_hd h1');
        const detailAuthor = detailDoc.querySelector('.rd > .rd_hd .member_plate');
        const boardChip = detailChip(detailDoc);
        const launcher = detailLauncher(detailDoc);
        const launcherStyle = launcher && detailDoc.defaultView.getComputedStyle(launcher);
        record('홈 버튼은 배경·아이콘·문구 없이 테두리와 접근성 이름만 있음', Boolean(launcher &&
          !launcher.querySelector('svg') && !launcher.textContent.trim() &&
          launcher.getAttribute('aria-label') && launcherStyle.borderTopStyle === 'solid' &&
          Number.parseFloat(launcherStyle.borderTopWidth) >= 1 &&
          ['transparent', 'rgba(0, 0, 0, 0)'].includes(launcherStyle.backgroundColor) &&
          launcherStyle.backgroundImage === 'none'));
        record('게시판 배지는 작성자 바로 앞에 있고 제목은 왼쪽에서 시작', Boolean(boardChip &&
          boardChip.nextElementSibling === detailAuthor &&
          titleHeading?.firstElementChild?.classList.contains('np_18px_span') &&
          !titleHeading.contains(boardChip) && boardChip.textContent.trim() === '해외축구' &&
          visiblyRendered(boardChip) && visiblyRendered(detailDoc.querySelector('#detail-content'))));

        const boardOff = detailOption(detailDoc, 'boardLabel', false);
        await delay(30);
        record('게시판 배지 OFF에서도 추천 숫자와 본문 유지', boardOff &&
          !visiblyRendered(detailChip(detailDoc)) && visiblyRendered(detailCount(detailDoc)) &&
          visiblyRendered(detailDoc.querySelector('#detail-content')));
        const boardOn = detailOption(detailDoc, 'boardLabel', true);
        const countOff = detailOption(detailDoc, 'count', false);
        await delay(30);
        record('추천 숫자 OFF에서도 게시판 배지와 본문 유지', boardOn && countOff &&
          visiblyRendered(detailChip(detailDoc)) && !visiblyRendered(detailCount(detailDoc)) &&
          visiblyRendered(detailDoc.querySelector('#detail-content')));
        const bothOff = detailOption(detailDoc, 'boardLabel', false);
        await delay(30);
        record('게시판 배지·추천 숫자 모두 OFF에서도 본문 유지', bothOff &&
          !visiblyRendered(detailChip(detailDoc)) && !visiblyRendered(detailCount(detailDoc)) &&
          visiblyRendered(detailDoc.querySelector('#detail-content')));
        const boardBackOn = detailOption(detailDoc, 'boardLabel', true);
        const countOn = detailOption(detailDoc, 'count', true);
        await delay(30);
        record('게시판 배지·추천 숫자 ON 조합 유지', boardBackOn && countOn &&
          visiblyRendered(detailChip(detailDoc)) && visiblyRendered(detailCount(detailDoc)) &&
          detailCount(detailDoc).textContent.includes('238') &&
          visiblyRendered(detailDoc.querySelector('#detail-content')));

        const disabledDoc = await makeDetailFrame(source, '전체 기능 OFF',
          { enabled: false, boardLabel: true, count: true });
        const disabledLauncher = detailLauncher(disabledDoc);
        record('전체 기능 OFF에서는 배지 숨김·빈 테두리 버튼 유지', Boolean(disabledLauncher &&
          !disabledLauncher.querySelector('svg') && !disabledLauncher.textContent.trim() &&
          disabledLauncher.getAttribute('aria-label')?.includes('꺼짐') &&

        record('상세가 없는 홈·목록 아래 드래그는 문서 맨끝으로 이동',
          Math.abs(requestedTop - navigationDoc.scrollingElement.scrollHeight) < 2 &&
          Math.abs(navigationView.scrollY - listPageMaxScroll) < 2);

        const progressMarkup = withComments => `
          <div class="bd"><div class="rd"><div class="rd_hd">
            <h1><span class="np_18px_span">읽기 진행률 검사</span></h1></div>
            <div class="rd_body"><article id="progress-article">본문</article></div></div>
            ${withComments ? '<div class="fdb_lst_wrp" id="progress-comments">댓글 목록</div>' : ''}
            <div id="progress-following-list" class="bd_lst_wrp">아래 글 목록</div></div>`;
        const progressCss = `.rd_hd{height:120px}#progress-article{height:450px}
          #progress-comments{height:600px}#progress-following-list{height:900px}`;
        const progressDoc = await makeLayoutFrame(source, '댓글 끝까지 읽기 진행률',
          progressMarkup(true), progressCss);
        progressDoc.defaultView.frameElement.style.width = '390px';
        progressDoc.defaultView.frameElement.style.height = '480px';
        const progressView = progressDoc.defaultView;
        const progressShadow = progressDoc.querySelector('#fm-clean-reading-header')?.shadowRoot;
        const progressBar = progressShadow?.querySelector('.bar');
        const progressMeter = progressShadow?.querySelector('progress');
        const scrollEndpointToViewportBottom = (doc, element) => {
          const view = doc.defaultView;
          view.scrollTo({ top: view.scrollY + element.getBoundingClientRect().bottom - view.innerHeight,
            behavior: 'instant' });
        };
        const scrollEndpointToViewportTop = (doc, element) => {
          const view = doc.defaultView;
          view.scrollTo({ top: view.scrollY + element.getBoundingClientRect().bottom,
            behavior: 'instant' });
        };
        scrollEndpointToViewportBottom(progressDoc, progressDoc.querySelector('#progress-article'));
        await delay(40);
        record('본문 끝이 화면 하단에 닿아도 댓글이 남으면 진행률은 100% 미만',
          progressBar && !progressBar.hidden && progressMeter.value > 0 &&
          progressMeter.value < 100 &&
          Math.abs(progressDoc.querySelector('#progress-article').getBoundingClientRect().bottom -
            progressView.innerHeight) < 2);
        scrollEndpointToViewportBottom(progressDoc, progressDoc.querySelector('#progress-comments'));
        await delay(40);
        record('댓글 끝이 화면 하단에 닿아도 진행률은 100% 미만',
          progressBar && !progressBar.hidden && progressMeter.value < 100 &&
          Math.abs(progressDoc.querySelector('#progress-comments').getBoundingClientRect().bottom -
            progressView.innerHeight) < 2);
        scrollEndpointToViewportTop(progressDoc, progressDoc.querySelector('#progress-comments'));
        await delay(40);
        record('댓글 끝이 화면 위에 닿으면 아래 글 목록이 남아도 진행률 100%',
          progressBar && !progressBar.hidden && progressMeter.value === 100 &&
          Math.abs(progressDoc.querySelector('#progress-comments').getBoundingClientRect().bottom) < 2 &&
          progressDoc.querySelector('#progress-following-list').getBoundingClientRect().bottom >
            progressView.innerHeight + 300 &&
          progressView.scrollY < progressDoc.scrollingElement.scrollHeight - progressView.innerHeight - 300);

        const noCommentDoc = await makeLayoutFrame(source, '댓글 없는 글의 진행률',
          progressMarkup(false), progressCss);
        noCommentDoc.defaultView.frameElement.style.width = '390px';
        noCommentDoc.defaultView.frameElement.style.height = '480px';
        scrollEndpointToViewportTop(noCommentDoc, noCommentDoc.querySelector('#progress-article'));
        await delay(40);
        const noCommentShadow = noCommentDoc.querySelector('#fm-clean-reading-header')?.shadowRoot;
        record('댓글이 없는 글은 본문 끝이 화면 위에 닿으면 진행률 100%',
          noCommentShadow && !noCommentShadow.querySelector('.bar').hidden &&
          noCommentShadow.querySelector('progress').value === 100 &&
          Math.abs(noCommentDoc.querySelector('#progress-article').getBoundingClientRect().bottom) < 2 &&
          noCommentDoc.querySelector('#progress-following-list').getBoundingClientRect().bottom >
            noCommentDoc.defaultView.innerHeight + 300);

        const readDay = 24 * 60 * 60 * 1000;
        const readNow = Date.now();
        const readListMarkup = `
          <div class="fm_best_widget"><div class="li"><span class="title">
            <a id="read-best" href="https://m.fmkorea.com/best/123">홈 포텐 글</a></span></div></div>
          <ul class="bd_m_lst"><li><div class="rt_area"><h3>
            <a id="read-mobile" href="https://m.fmkorea.com/board/123">모바일 목록 글</a>
          </h3></div></li></ul>
          <table class="bd_lst"><tr><td class="title">
            <a id="read-table" href="https://m.fmkorea.com/123">일반 목록 글</a>
            <a id="read-query" href="https://m.fmkorea.com/?document_srl=123">쿼리 링크</a>
            <a id="read-expired" href="https://m.fmkorea.com/456">만료된 글</a>
            <a id="read-external" href="https://example.org/123">외부 링크</a>
          </td></tr></table>`;
        const readListDoc = await makeLayoutFrame(source, '읽은 글 7일 표시와 링크 정규화',
          `<div class="bd">${readListMarkup}</div>`, '', {},
          { history: { version: 1, entries: [['123', readNow - 6 * readDay],
            ['456', readNow - 8 * readDay]] } });
        const readAttr = id => readListDoc.querySelector(`#${id}`)?.getAttribute('data-fm-clean-read');
        record('6일 읽은 글은 홈·모바일·일반 목록과 URL 네 형태에서 같은 ID로 표시',
          ['read-best', 'read-mobile', 'read-table', 'read-query'].every(id => readAttr(id) === '123') &&
          readListDoc.defaultView.getComputedStyle(readListDoc.querySelector('#read-best')).color !==
            readListDoc.defaultView.getComputedStyle(readListDoc.querySelector('#read-expired')).color &&
          !readListDoc.querySelector('#read-best').classList.contains('visited'));
        record('8일 지난 글과 외부 사이트의 같은 숫자 URL은 읽음 처리하지 않음',
          !readAttr('read-expired') && !readAttr('read-external'));
        const readOff = detailOption(readListDoc, 'readHistory', false);
        await delay(40);
        const readHidden = !readAttr('read-best') && !readAttr('read-mobile');
        const readOn = detailOption(readListDoc, 'readHistory', true);
        await delay(40);
        record('읽은 글 표시 OFF는 속성을 제거하고 ON은 저장된 6일 기록을 복원',
          readOff && readHidden && readOn && readAttr('read-best') === '123' &&
          readAttr('read-mobile') === '123');
        const remoteHistory = readListDoc.defaultView.__fmReadFixture;
        const remoteOld = remoteHistory.value;
        remoteHistory.value = { version: 1, entries: [['456', Date.now()]] };
        remoteHistory.listeners.forEach(listener =>
          listener('pimi.fmkorea.read-history.v1', remoteOld, remoteHistory.value, true));
        await delay(80);
        record('다른 탭의 읽음 기록을 반영하면서 기존 6일 기록도 보존',
          readAttr('read-expired') === '456' && readAttr('read-best') === '123' &&
          remoteHistory.value.entries.length === 2 && remoteHistory.writes.length === 1);
        readListDoc.querySelector('td.title').insertAdjacentHTML('beforeend',
          '<a id="read-back" href="https://www.fmkorea.com/best/654">뒤로 온 목록의 새 기록</a>');
        remoteHistory.value.entries.push(['654', Date.now()]);
        await delay(40);
        const beforeBack = !readAttr('read-back');
        readListDoc.defaultView.dispatchEvent(new readListDoc.defaultView.PageTransitionEvent('pageshow',
          { persisted: true }));
        await delay(80);
        record('뒤로 가기로 복원된 목록은 저장소를 다시 읽어 새 읽음 기록 표시',
          beforeBack && readAttr('read-back') === '654' && readAttr('read-best') === '123');

        const readDetailDoc = await makeLayoutFrame(source, '상세 읽음 기록은 새 방문 한 번만', `
          <div class="bd"><div class="rd" data-docsrl="789">
            <div class="rd_hd"><h1><span class="np_18px_span">상세 읽음 글</span></h1></div>
            <div class="rd_body"><article id="read-detail-body">본문 유지</article></div>
          </div></div>`);
        const detailHistory = readDetailDoc.defaultView.__fmReadFixture;
        const readTimestamp = () => detailHistory.value?.entries?.find(([id]) => String(id) === '789')?.[1];
        const firstReadTimestamp = readTimestamp();
        readDetailDoc.querySelector('.rd').classList.add('site-updated');
        readDetailDoc.querySelector('#read-detail-body').style.paddingTop = '1px';
        await delay(100);
        record('상세 최초 방문만 기록하고 DOM 갱신은 7일 만료 시각을 연장하지 않음',
          Number.isFinite(firstReadTimestamp) &&
          Math.abs(firstReadTimestamp - Date.now()) < 2000 &&
          readTimestamp() === firstReadTimestamp &&
          visiblyRendered(readDetailDoc.querySelector('#read-detail-body')));

        const bulkEntries = Array.from({ length: 2000 }, (_, index) =>
          [String(10000 + index), readNow - 2 * readDay]);
        const bulkDoc = await makeLayoutFrame(source, '읽은 글 기록 개수 제한 없음', `
          <div class="bd"><div class="fm_best_widget"><span class="title">
            <a id="read-first" href="https://m.fmkorea.com/10000">처음 기록</a>
            <a id="read-last" href="https://m.fmkorea.com/11999">마지막 기록</a>
          </span></div><div class="rd" data-docsrl="12000">
            <div class="rd_hd"><h1><span class="np_18px_span">새 글</span></h1></div>
            <div class="rd_body"><article>본문</article></div></div></div>`, '', {},
          { history: { version: 1, entries: bulkEntries } });
        const bulkSaved = bulkDoc.defaultView.__fmReadFixture.value?.entries || [];
        record('기록 2000개가 있어도 앞·뒤 기록을 유지하고 새 방문을 추가',
          bulkDoc.querySelector('#read-first')?.getAttribute('data-fm-clean-read') === '10000' &&
          bulkDoc.querySelector('#read-last')?.getAttribute('data-fm-clean-read') === '11999' &&
          bulkSaved.length === 2001 &&
          bulkSaved.some(([id]) => String(id) === '12000'));

        const badHistoryMarkup = `<div class="bd"><div class="rd" data-docsrl="900">
          <div class="rd_hd"><h1><span class="np_18px_span">오류 복구 글</span></h1></div>
          <div class="rd_body"><article id="bad-history-body">본문 유지</article></div></div></div>`;
        const malformedDoc = await makeLayoutFrame(source, '잘못된 읽음 저장값',
          badHistoryMarkup, '', {}, { history: { version: 1, entries: 'broken' } });
        const writeFailDoc = await makeLayoutFrame(source, '읽음 저장 쓰기 실패',
          badHistoryMarkup, '', {}, { failWrites: true });
        record('저장값 형식 오류와 쓰기 실패에도 상세 본문·제어 버튼 유지',
          [malformedDoc, writeFailDoc].every(doc =>
            visiblyRendered(doc.querySelector('#bad-history-body')) && detailLauncher(doc)));
      } catch (error) {
        record('검사 실행', false, error?.message || String(error));
      }
      document.documentElement.dataset.testStatus = failed ? 'failed' : 'passed';
      summary.textContent = `${passed} PASS · ${failed} FAIL`;
    })();
  </script>
</body>
</html>
