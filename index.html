---
layout: home
---

<style>
  .home-ripple {
    position: relative;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    isolation: isolate;
    padding: 96px 24px 40px;
    background: #050917 url("{{ "/img/cosmic-space-bg.png" | prepend: site.baseurl }}") center center / cover no-repeat;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .home-ripple,
  .home-ripple * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .home-ripple::selection,
  .home-ripple *::selection {
    background: transparent;
  }

  .home-ripple:before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 42%, rgba(2, 4, 14, .24) 100%),
      linear-gradient(180deg, rgba(1, 3, 12, .18), transparent 34%, rgba(1, 3, 12, .12));
    z-index: 0;
  }

  .home-ripple:after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 20% 42%, rgba(144, 83, 255, .08), transparent 28rem);
    z-index: 0;
  }

  .home-starfield-canvas,
  .home-ripple-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .home-starfield-canvas {
    z-index: 0;
    opacity: 0;
    pointer-events: none;
  }

  .home-starfield-canvas[data-starsea-ready] {
    opacity: 1;
  }

  .home-ripple-canvas {
    z-index: 1;
    touch-action: none;
  }

  .home-ripple-text {
    margin: 0;
    font-family: var(--cosmic-display-font);
    font-size: 30px;
    font-weight: 380;
    line-height: 1.2;
    letter-spacing: 0;
    color: rgba(248, 250, 255, .94);
    text-shadow:
      0 0 16px rgba(172, 185, 255, .38),
      0 0 44px rgba(91, 98, 202, .22),
      0 10px 34px rgba(0, 0, 0, .38);
  }

  .home-ripple-copy {
    position: relative;
    z-index: 2;
    width: max-content;
    text-align: center;
  }

  .home-memo-trigger {
    display: block;
    width: 100%;
    height: 1.2em;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    font-size: 30px;
    cursor: default;
    touch-action: manipulation;
  }

  @media only screen and (max-width: 768px) {
    .home-ripple {
      background-position: 68% center;
      align-items: flex-start;
      padding-top: 42vh;
    }

    .home-ripple-text {
      font-size: 28px;
    }

    .home-memo-trigger {
      font-size: 28px;
    }
  }
</style>

<style>
  html,
  body {
    min-height: 100%;
    overflow: hidden;
    background: #050917;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
  }
</style>

<section class="home-ripple" aria-label="welcome">
  <canvas class="home-starfield-canvas" data-starsea-canvas aria-hidden="true"></canvas>
  <canvas class="home-ripple-canvas" data-ripple-canvas aria-hidden="true"></canvas>
  <div class="home-ripple-copy">
    <p class="home-ripple-text">hello.</p>
    <button class="home-memo-trigger" type="button" data-memo-trigger aria-label="메모 열기"></button>
  </div>
</section>

<script>
(function () {
  var trigger = document.querySelector('[data-memo-trigger]');
  if (!trigger) return;

  var clicks = 0;
  var resetTimer = null;

  trigger.addEventListener('click', function () {
    clicks += 1;
    window.clearTimeout(resetTimer);

    if (clicks >= 3) {
      clicks = 0;
      window.location.assign('{{ "/p/hidden-memo/" | relative_url }}');
      return;
    }

    resetTimer = window.setTimeout(function () {
      clicks = 0;
    }, 700);
  });
}());
</script>

<script>
(function () {
  var canvas = document.querySelector('[data-ripple-canvas]');
  var section = canvas && canvas.closest('.home-ripple');
  if (!canvas || !section) return;
  var ctx = canvas.getContext('2d');
  if (!ctx) return;
  var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var target = null;
  var comet = null;
  var cometVelocity = { x: 0, y: 0 };
  var tail = [];
  var tailLength = 256;
  var headArc = 0;
  var retiredArc = 0;
  var eraseFromArc = 0;
  var eraseToArc = 0;
  var tailLifetime = 2200;
  var slowSpeedLimit = 0.025;
  var drawEnergy = 0.65;
  var lastPosition = null;
  var lastMotion = 0;
  var eraseStartedAt = null;
  var restingCurve = null;
  var keys = {};
  var keyboardVelocity = { x: 0, y: 0 };
  var raf = null;
  var bounds = null;
  var lastFrame = 0;

  function lerp(from, to, amount) { return from + (to - from) * amount; }
  function smooth(value) {
    var t = Math.max(0, Math.min(1, value));
    return t * t * (3 - 2 * t);
  }
  function fadeByAge(age) {
    return 1 - smooth(age / tailLifetime);
  }
  function publish(active) {
    var point = comet || lastPosition;
    if (point) section.dispatchEvent(new CustomEvent('home-cursor-move', {
      detail: { x: point.x, y: point.y, active: active }
    }));
  }
  function schedule() {
    if (!raf && !motionQuery.matches && !document.hidden) raf = requestAnimationFrame(draw);
  }
  function stop() {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    tail = [];
    target = comet = null;
    cometVelocity.x = cometVelocity.y = 0;
    keyboardVelocity.x = keyboardVelocity.y = 0;
    keys = {};
    lastFrame = 0;
    eraseStartedAt = null;
    restingCurve = null;
    headArc = retiredArc = eraseFromArc = eraseToArc = 0;
    if (bounds) ctx.clearRect(0, 0, bounds.width, bounds.height);
    publish(false);
  }
  function resize() {
    bounds = section.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5,
      Math.sqrt(2200000 / Math.max(1, bounds.width * bounds.height)));
    canvas.width = Math.max(1, Math.round(bounds.width * dpr));
    canvas.height = Math.max(1, Math.round(bounds.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stop();
  }
  function moveTarget(x, y, time, inputTime) {
    lastPosition = { x: x, y: y };
    if (!comet || !target) {
      comet = { x: x, y: y };
      target = { x: x, y: y, inputTime: inputTime };
      cometVelocity.x = cometVelocity.y = 0;
      tail = [{ x: x, y: y, arc: headArc }];
      lastMotion = time;
      eraseStartedAt = null;
      return;
    }
    var distance = Math.hypot(x - target.x, y - target.y);
    if (distance < 0.35) return;
    var speed = distance / Math.max(4, inputTime - target.inputTime);
    var movementEnergy = 1 - Math.exp(-speed * 1.25);
    if (speed < slowSpeedLimit) movementEnergy *= 0.25;
    drawEnergy = Math.max(0.45, Math.min(0.9, 0.45 + movementEnergy * 0.45));
    target = { x: x, y: y, inputTime: inputTime };
    // Retire the elapsed section before cancelling an idle fade. This boundary
    // only moves forward, including across stop/resume and direction changes.
    retireTail(time);
    lastMotion = time;
    eraseStartedAt = null;
    restingCurve = null;
    if (!tail.length) tail.push({ x: comet.x, y: comet.y, arc: headArc });
  }
  function trimTail() {
    retiredArc = Math.max(retiredArc, headArc - 540);
    while (tail.length > 1 && tail[tail.length - 2].arc <= retiredArc) tail.pop();
    var oldest = tail[tail.length - 1];
    if (oldest && oldest.arc < retiredArc) {
      var newer = tail[tail.length - 2] || { x: comet.x, y: comet.y, arc: headArc };
      if (newer.arc <= retiredArc) tail = [];
      else {
        var fraction = (retiredArc - oldest.arc) / (newer.arc - oldest.arc);
        tail[tail.length - 1] = { x: lerp(oldest.x, newer.x, fraction),
          y: lerp(oldest.y, newer.y, fraction), arc: retiredArc };
      }
    }
    if (tail.length > tailLength) {
      tail.length = tailLength;
      retiredArc = Math.max(retiredArc, tail[tail.length - 1].arc);
    }
  }
  function retireTail(time) {
    if (eraseStartedAt !== null) {
      var age = Math.max(0, time - eraseStartedAt);
      var retreatDistance = (eraseToArc - eraseFromArc) * (1 - fadeByAge(age));
      retiredArc = Math.max(retiredArc, eraseFromArc + retreatDistance);
    }
    trimTail();
  }
  function recordHead() {
    if (!tail.length || Math.hypot(comet.x - tail[0].x, comet.y - tail[0].y) >= 3) {
      tail.unshift({ x: comet.x, y: comet.y, arc: headArc });
    }
    trimTail();
  }
  function advanceKeyboard(dt, now) {
    var x = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    var y = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    var length = Math.hypot(x, y) || 1;
    var ease = 1 - Math.exp(-dt * 16);
    keyboardVelocity.x = lerp(keyboardVelocity.x, x / length * 480, ease);
    keyboardVelocity.y = lerp(keyboardVelocity.y, y / length * 480, ease);
    var moving = Math.hypot(keyboardVelocity.x, keyboardVelocity.y) > 1;
    if (moving && lastPosition) moveTarget(
      Math.max(10, Math.min(bounds.width - 10, lastPosition.x + keyboardVelocity.x * dt)),
      Math.max(10, Math.min(bounds.height - 10, lastPosition.y + keyboardVelocity.y * dt)), now, now);
    return moving || x !== 0 || y !== 0;
  }
  function advanceComet(dt) {
    if (!comet || !target) return false;
    // A continuous, critically damped follower keeps momentum through a turn.
    // Integrate at 120 Hz so the curve is independent of display refresh rate.
    var steps = Math.max(1, Math.ceil(dt * 120));
    var step = dt / steps;
    var frequency = 26;
    var decay = Math.exp(-frequency * step);
    for (var i = 0; i < steps; i += 1) {
      var previousX = comet.x, previousY = comet.y;
      var dx = comet.x - target.x;
      var dy = comet.y - target.y;
      var tx = (cometVelocity.x + frequency * dx) * step;
      var ty = (cometVelocity.y + frequency * dy) * step;
      comet.x = target.x + (dx + tx) * decay;
      comet.y = target.y + (dy + ty) * decay;
      cometVelocity.x = (cometVelocity.x - frequency * tx) * decay;
      cometVelocity.y = (cometVelocity.y - frequency * ty) * decay;
      headArc += Math.hypot(comet.x - previousX, comet.y - previousY);
      recordHead();
    }
    if (Math.hypot(comet.x - target.x, comet.y - target.y) < 0.25 &&
        Math.hypot(cometVelocity.x, cometVelocity.y) < 6) {
      headArc += Math.hypot(comet.x - target.x, comet.y - target.y);
      comet.x = target.x;
      comet.y = target.y;
      recordHead();
      cometVelocity.x = cometVelocity.y = 0;
      return false;
    }
    return true;
  }
  function centerline() {
    var points = [{ x: comet.x, y: comet.y, distance: 0 }];
    var maxTailSegments = Math.min(tail.length, tailLength);
    for (var i = 0; i < maxTailSegments; i += 1) {
      if (tail[i].arc < retiredArc) break;
      var distance = headArc - tail[i].arc;
      if (distance > points[points.length - 1].distance + 0.01) {
        points.push({ x: tail[i].x, y: tail[i].y, distance: distance });
      }
    }
    return points;
  }
  function sampleCurve(points) {
    // Use distance, rather than event count, for a consistent bend radius.
    // This also rounds a corner made by pausing before changing direction.
    var visibleDistance = points[points.length - 1].distance;
    var regular = [];
    var index = 1;
    for (var at = 0; at < visibleDistance + 4; at += 4) {
      var distance = Math.min(at, visibleDistance);
      while (index < points.length - 1 && points[index].distance < distance) index += 1;
      var a = points[index - 1], b = points[index];
      var fraction = (distance - a.distance) / Math.max(0.001, b.distance - a.distance);
      regular.push({ x: lerp(a.x, b.x, fraction), y: lerp(a.y, b.y, fraction), distance: distance });
      if (distance === visibleDistance) break;
    }
    var softened = regular.map(function (point, i) {
      var x = 0, y = 0, total = 0;
      for (var offset = -9; offset <= 9; offset += 1) {
        var neighbor = regular[Math.max(0, Math.min(regular.length - 1, i + offset))];
        var weight = 10 - Math.abs(offset);
        x += neighbor.x * weight;
        y += neighbor.y * weight;
        total += weight;
      }
      // Anchor the live head and the retirement boundary to avoid tip drift.
      var blend = smooth(Math.min(point.distance, visibleDistance - point.distance) / 28);
      return { x: lerp(point.x, x / total, blend), y: lerp(point.y, y / total, blend),
        distance: point.distance };
    });
    var rounded = [softened[0]];
    for (var i = 1; i < softened.length - 1; i += 1) {
      var control = softened[i];
      var next = softened[i + 1];
      var end = { x: (control.x + next.x) / 2, y: (control.y + next.y) / 2,
        distance: (control.distance + next.distance) / 2 };
      var start = rounded[rounded.length - 1];
      var steps = Math.max(1, Math.ceil((end.distance - start.distance) / 3));
      for (var j = 1; j <= steps; j += 1) {
        var t = j / steps, u = 1 - t;
        rounded.push({ x: u * u * start.x + 2 * u * t * control.x + t * t * end.x,
          y: u * u * start.y + 2 * u * t * control.y + t * t * end.y,
          distance: u * u * start.distance + 2 * u * t * control.distance + t * t * end.distance });
      }
    }
    rounded.push(softened[softened.length - 1]);
    return rounded;
  }
  function clipCurve(points, visibleDistance) {
    var clipped = [points[0]];
    for (var i = 1; i < points.length; i += 1) {
      var a = points[i - 1], b = points[i];
      if (b.distance < visibleDistance) clipped.push(b);
      else {
        var fraction = (visibleDistance - a.distance) / Math.max(0.001, b.distance - a.distance);
        clipped.push({ x: lerp(a.x, b.x, fraction), y: lerp(a.y, b.y, fraction),
          distance: visibleDistance });
        break;
      }
    }
    return clipped;
  }
  function drawMeteorTail(points, visibleDistance, featherDistance, width, alpha) {
    if (points.length < 2) return;
    var left = [], right = [];
    var normal = { x: 0, y: 1 };
    for (var i = 0; i < points.length; i += 1) {
      var previous = points[Math.max(0, i - 1)];
      var next = points[Math.min(points.length - 1, i + 1)];
      var dx = next.x - previous.x, dy = next.y - previous.y;
      var length = Math.hypot(dx, dy);
      if (length > 0.01) {
        var nx = -dy / length, ny = dx / length;
        if (i && nx * normal.x + ny * normal.y < 0) { nx = -nx; ny = -ny; }
        normal = { x: nx, y: ny };
      }
      var tailSegmentFade = smooth((visibleDistance - points[i].distance) / featherDistance);
      // Dissolve with transparency, rather than squeezing an opaque needle.
      var radius = width * 0.5 * (0.7 + 0.3 * tailSegmentFade);
      left.push({ x: points[i].x + normal.x * radius, y: points[i].y + normal.y * radius });
      right.push({ x: points[i].x - normal.x * radius, y: points[i].y - normal.y * radius });
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    function colorAt(distance) {
      var opacity = smooth((visibleDistance - distance) / featherDistance);
      return 'rgba(180, 214, 255,' + alpha * opacity + ')';
    }
    function fillSpan(from, to, feather) {
      if (feather) {
        var a = points[from], b = points[to];
        var gradient = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
        gradient.addColorStop(0, colorAt(a.distance));
        gradient.addColorStop(0.5, colorAt((a.distance + b.distance) / 2));
        gradient.addColorStop(1, colorAt(b.distance));
        ctx.fillStyle = gradient;
      } else ctx.fillStyle = 'rgba(180, 214, 255,' + alpha + ')';
      ctx.beginPath();
      ctx.moveTo(left[from].x, left[from].y);
      for (var j = from + 1; j < to; j += 1) ctx.quadraticCurveTo(left[j].x, left[j].y,
        (left[j].x + left[j + 1].x) / 2, (left[j].y + left[j + 1].y) / 2);
      ctx.lineTo(left[to].x, left[to].y);
      ctx.lineTo(right[to].x, right[to].y);
      for (var k = to - 1; k > from; k -= 1) ctx.quadraticCurveTo(right[k].x, right[k].y,
        (right[k].x + right[k - 1].x) / 2, (right[k].y + right[k - 1].y) / 2);
      ctx.lineTo(right[from].x, right[from].y);
      ctx.closePath();
      ctx.fill();
    }
    var firstFeather = 0;
    while (firstFeather < points.length - 1 &&
      points[firstFeather + 1].distance <= visibleDistance - featherDistance) firstFeather += 1;
    if (firstFeather) fillSpan(0, firstFeather, false);
    // Only the dissolving end needs short gradient spans. Shared edges and
    // additive blending keep the ribbon continuous without round-cap dots.
    for (var from = firstFeather; from < points.length - 1;) {
      var to = from + 1;
      while (to < points.length - 1 && points[to].distance - points[from].distance < 18) to += 1;
      fillSpan(from, to, true);
      from = to;
    }
    ctx.restore();
  }
  function draw() {
    raf = null;
    var now = performance.now();
    var dt = lastFrame ? Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000)) : 1 / 60;
    lastFrame = now;
    ctx.clearRect(0, 0, bounds.width, bounds.height);
    if (motionQuery.matches || document.hidden) { stop(); return; }
    var keyboardMoving = advanceKeyboard(dt, now);
    var moving = advanceComet(dt);
    if (!comet) return;
    if (moving || keyboardMoving) eraseStartedAt = null;
    else if (eraseStartedAt === null && now - lastMotion >= 90) {
      eraseStartedAt = now;
      eraseFromArc = retiredArc;
      eraseToArc = headArc;
      var settled = centerline();
      restingCurve = settled.length > 1 ? sampleCurve(settled) : null;
    }
    retireTail(now);
    var age = eraseStartedAt === null ? 0 : Math.max(0, now - eraseStartedAt);
    var remaining = fadeByAge(age);
    if (remaining <= 0) { tail = []; restingCurve = null; }
    if (tail.length) {
      var visibleDistance = Math.max(0, headArc - retiredArc);
      var curve = restingCurve || centerline();
      var featherDistance = 180;
      if (curve.length > 1 && visibleDistance > 0.01) {
        var points = restingCurve ? clipCurve(restingCurve, visibleDistance) : sampleCurve(curve);
        drawMeteorTail(points, visibleDistance, featherDistance, 10, 0.055);
        drawMeteorTail(points, visibleDistance, featherDistance, 3.2, 0.68);
      }
      var headFade = eraseStartedAt === null ? 1 :
        eraseToArc - eraseFromArc < 0.5 ? remaining :
        smooth(visibleDistance / Math.min(140, eraseToArc - eraseFromArc));
      var meteorAlpha = Math.max(0.55, drawEnergy) * headFade;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      var headGlow = ctx.createRadialGradient(comet.x, comet.y, 0, comet.x, comet.y, 20);
      headGlow.addColorStop(0, 'rgba(242, 250, 255,' + meteorAlpha * 0.7 + ')');
      headGlow.addColorStop(0.12, 'rgba(191, 224, 255,' + meteorAlpha * 0.36 + ')');
      headGlow.addColorStop(0.42, 'rgba(123, 176, 255,' + meteorAlpha * 0.08 + ')');
      headGlow.addColorStop(1, 'rgba(112, 155, 255, 0)');
      ctx.fillStyle = headGlow;
      ctx.fillRect(comet.x - 20, comet.y - 20, 40, 40);
      ctx.fillStyle = 'rgba(239, 249, 255,' + meteorAlpha * 0.85 + ')';
      ctx.beginPath();
      ctx.arc(comet.x, comet.y, 2.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    if (moving || keyboardMoving) publish(true);
    if (tail.length || moving || keyboardMoving) schedule();
    else lastFrame = 0;
  }
  function handleMove(event) {
    if (motionQuery.matches || document.hidden || event.isPrimary === false) return;
    keys = {};
    keyboardVelocity.x = keyboardVelocity.y = 0;
    var samples = event.getCoalescedEvents ? event.getCoalescedEvents() : [];
    samples = samples.length ? samples.concat([event]) : [event];
    var now = performance.now();
    for (var i = 0; i < samples.length; i += 1) {
      var point = samples[i].touches ? samples[i].touches[0] : samples[i];
      if (point) moveTarget(point.clientX - bounds.left, point.clientY - bounds.top, now,
        isFinite(samples[i].timeStamp) ? samples[i].timeStamp : now);
    }
    publish(true);
    schedule();
  }
  function leave() {
    if (!Object.keys(keys).length) publish(false);
  }
  function interactiveTarget(element) {
    return element && element.closest && element.closest('a, button, input, textarea, select, [contenteditable="true"]');
  }
  window.addEventListener('keydown', function (event) {
    if (event.altKey || event.ctrlKey || event.metaKey || interactiveTarget(event.target) || motionQuery.matches) return;
    var key = event.code || event.key;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].indexOf(key) !== -1) {
      event.preventDefault();
      if (!lastPosition) lastPosition = { x: bounds.width / 2, y: bounds.height / 2 };
      keys[key] = true;
      schedule();
    } else if (key === 'Space' && !event.repeat) {
      event.preventDefault();
      var point = comet || lastPosition || { x: bounds.width / 2, y: bounds.height / 2 };
      publish(true);
      section.dispatchEvent(new CustomEvent('home-cursor-burst', { detail: { x: point.x, y: point.y } }));
    }
  });
  window.addEventListener('keyup', function (event) {
    delete keys[event.code || event.key];
    if (Object.keys(keys).length) schedule();
  });
  resize();
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('blur', stop);
  if ('PointerEvent' in window) {
    section.addEventListener('pointermove', handleMove, { passive: true });
    section.addEventListener('pointerdown', handleMove, { passive: true });
    section.addEventListener('pointerleave', leave, { passive: true });
    section.addEventListener('pointerup', function (event) { if (event.pointerType === 'touch') leave(); }, { passive: true });
  } else {
    section.addEventListener('touchmove', handleMove, { passive: true });
    section.addEventListener('touchstart', handleMove, { passive: true });
    section.addEventListener('touchend', leave, { passive: true });
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });
  window.addEventListener('pagehide', stop);
  window.addEventListener('pageshow', resize);
  if (motionQuery.addEventListener) motionQuery.addEventListener('change', stop);
  else if (motionQuery.addListener) motionQuery.addListener(stop);
}());
</script>
