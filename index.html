---
layout: home
---

<style>
  .home-ripple {
    position: relative;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    isolation: isolate;
    padding: 96px 24px 40px;
    background: #050917 url("{{ "/img/cosmic-space-bg.png" | prepend: site.baseurl }}") center center / cover no-repeat;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .home-ripple,
  .home-ripple * {
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .home-ripple::selection,
  .home-ripple *::selection {
    background: transparent;
  }

  .home-ripple:before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at center, transparent 42%, rgba(2, 4, 14, .24) 100%),
      linear-gradient(180deg, rgba(1, 3, 12, .18), transparent 34%, rgba(1, 3, 12, .12));
    z-index: 0;
  }

  .home-ripple:after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 20% 42%, rgba(144, 83, 255, .08), transparent 28rem);
    z-index: 0;
  }

  .home-starfield-canvas,
  .home-ripple-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .home-starfield-canvas {
    z-index: 0;
    opacity: 0;
    pointer-events: none;
  }

  .home-starfield-canvas[data-starsea-ready] {
    opacity: 1;
  }

  .home-ripple-canvas {
    z-index: 1;
    touch-action: none;
  }

  .home-ripple-text {
    margin: 0;
    font-family: var(--cosmic-display-font);
    font-size: 30px;
    font-weight: 380;
    line-height: 1.2;
    letter-spacing: 0;
    color: rgba(248, 250, 255, .94);
    text-shadow:
      0 0 16px rgba(172, 185, 255, .38),
      0 0 44px rgba(91, 98, 202, .22),
      0 10px 34px rgba(0, 0, 0, .38);
  }

  .home-ripple-copy {
    position: relative;
    z-index: 2;
    width: max-content;
    text-align: center;
  }

  .home-memo-trigger {
    display: block;
    width: 100%;
    height: 1.2em;
    margin: 0;
    padding: 0;
    border: 0;
    background: transparent;
    font-size: 30px;
    cursor: default;
    touch-action: manipulation;
  }

  @media only screen and (max-width: 768px) {
    .home-ripple {
      background-position: 68% center;
      align-items: flex-start;
      padding-top: 42vh;
    }

    .home-ripple-text {
      font-size: 28px;
    }

    .home-memo-trigger {
      font-size: 28px;
    }
  }
</style>

<style>
  html,
  body {
    min-height: 100%;
    overflow: hidden;
    background: #050917;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
  }
</style>

<section class="home-ripple" aria-label="welcome">
  <canvas class="home-starfield-canvas" data-starsea-canvas aria-hidden="true"></canvas>
  <canvas class="home-ripple-canvas" data-ripple-canvas aria-hidden="true"></canvas>
  <div class="home-ripple-copy">
    <p class="home-ripple-text">hello.</p>
    <button class="home-memo-trigger" type="button" data-memo-trigger aria-label="메모 열기"></button>
  </div>
</section>

<script>
(function () {
  var trigger = document.querySelector('[data-memo-trigger]');
  if (!trigger) return;

  var clicks = 0;
  var resetTimer = null;

  trigger.addEventListener('click', function () {
    clicks += 1;
    window.clearTimeout(resetTimer);

    if (clicks >= 3) {
      clicks = 0;
      window.location.assign('{{ "/p/hidden-memo/" | relative_url }}');
      return;
    }

    resetTimer = window.setTimeout(function () {
      clicks = 0;
    }, 700);
  });
}());
</script>

<script>
(function () {
  'use strict';
  var canvas = document.querySelector('[data-ripple-canvas]');
  var section = canvas && canvas.closest('.home-ripple');
  if (!canvas || !section) return;
  var ctx = canvas.getContext('2d');
  if (!ctx) return;

  // Motion reference: Skiper UI's SpringMouseFollow (skiper61), by gxuri.
  // https://skiper-ui.com/v1/skiper61 — implemented here without React or Motion.
  var springConfig = { mass: 0.1, damping: 10, stiffness: 131 };
  var root = Math.sqrt(springConfig.damping * springConfig.damping -
    4 * springConfig.mass * springConfig.stiffness);
  var slow = (-springConfig.damping + root) / (2 * springConfig.mass);
  var fast = (-springConfig.damping - root) / (2 * springConfig.mass);
  var motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  var x = { value: 0, velocity: 0 };
  var y = { value: 0, velocity: 0 };
  var opacity = { value: 0, velocity: 0 };
  var scale = { value: 0, velocity: 0 };
  var wake = [];
  var wakeCount = 36;
  var target = null;
  var lastPosition = null;
  var active = false;
  var keys = {};
  var keyboardVelocity = { x: 0, y: 0 };
  var bounds = null;
  var raf = null;
  var lastFrame = 0;

  function advanceSpring(state, goal, dt) {
    // Exact overdamped solution: the same spring feel at 60 Hz and 120 Hz,
    // including opacity/scale reversals when quickly entering and leaving.
    var offset = state.value - goal;
    var a = (state.velocity - fast * offset) / (slow - fast);
    var b = offset - a;
    var decaySlow = Math.exp(slow * dt), decayFast = Math.exp(fast * dt);
    state.value = goal + a * decaySlow + b * decayFast;
    state.velocity = a * slow * decaySlow + b * fast * decayFast;
    if (Math.abs(state.value - goal) < 0.001 && Math.abs(state.velocity) < 0.01) {
      state.value = goal;
      state.velocity = 0;
      return false;
    }
    return true;
  }
  function publish(visible) {
    if (!target) return;
    section.dispatchEvent(new CustomEvent('home-cursor-move', {
      detail: { x: x.value, y: y.value, active: visible }
    }));
  }
  function schedule() {
    if (!raf && !motionQuery.matches && !document.hidden) raf = requestAnimationFrame(draw);
  }
  function stop() {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    active = false;
    publish(false);
    target = null;
    x.velocity = y.velocity = 0;
    opacity.value = opacity.velocity = scale.value = scale.velocity = 0;
    wake = [];
    keyboardVelocity.x = keyboardVelocity.y = 0;
    keys = {};
    lastFrame = 0;
    if (bounds) ctx.clearRect(0, 0, bounds.width, bounds.height);
  }
  function resize() {
    bounds = section.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5,
      Math.sqrt(2200000 / Math.max(1, bounds.width * bounds.height)));
    canvas.width = Math.max(1, Math.round(bounds.width * dpr));
    canvas.height = Math.max(1, Math.round(bounds.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    stop();
  }
  function moveTarget(px, py) {
    if (!target) {
      // The first entry grows at the pointer; it never flies in from (0, 0).
      x.value = px;
      y.value = py;
      x.velocity = y.velocity = 0;
      wake = [];
      for (var i = 0; i < wakeCount; i += 1) wake.push({ x: px, y: py });
    }
    target = { x: px, y: py };
    lastPosition = { x: px, y: py };
    active = true;
    publish(true);
    schedule();
  }
  function advanceKeyboard(dt) {
    var dx = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    var dy = (keys.ArrowDown || keys.KeyS ? 1 : 0) - (keys.ArrowUp || keys.KeyW ? 1 : 0);
    var length = Math.hypot(dx, dy) || 1;
    var ease = 1 - Math.exp(-dt * 16);
    keyboardVelocity.x += (dx / length * 480 - keyboardVelocity.x) * ease;
    keyboardVelocity.y += (dy / length * 480 - keyboardVelocity.y) * ease;
    var moving = Math.hypot(keyboardVelocity.x, keyboardVelocity.y) > 1;
    if (moving && lastPosition) moveTarget(
      Math.max(20, Math.min(bounds.width - 20, lastPosition.x + keyboardVelocity.x * dt)),
      Math.max(20, Math.min(bounds.height - 20, lastPosition.y + keyboardVelocity.y * dt)));
    return moving || dx !== 0 || dy !== 0;
  }
  function advanceWake(dt, previousX, previousY) {
    // A chain follows the accepted spring head, rather than recording mouse
    // history. At rest it catches up, so a faded old route cannot be restored.
    var steps = Math.max(1, Math.ceil(dt * 240));
    var follow = 1 - Math.exp(-72 * dt / steps);
    var moving = false;
    for (var step = 1; step <= steps; step += 1) {
      var leadX = previousX + (x.value - previousX) * step / steps;
      var leadY = previousY + (y.value - previousY) * step / steps;
      for (var i = 0; i < wake.length; i += 1) {
        var node = wake[i];
        node.x += (leadX - node.x) * follow;
        node.y += (leadY - node.y) * follow;
        var dx = node.x - leadX, dy = node.y - leadY;
        var distance = Math.hypot(dx, dy);
        if (distance > 14) {
          node.x = leadX + dx / distance * 14;
          node.y = leadY + dy / distance * 14;
        }
        if (Math.hypot(node.x - x.value, node.y - y.value) > 0.05) moving = true;
        leadX = node.x;
        leadY = node.y;
      }
    }
    return moving;
  }
  function wakeCurve() {
    var points = [{ x: x.value, y: y.value, u: 0, distance: 0 }];
    var distance = 0;
    for (var i = 0; i < wake.length; i += 1) {
      var previous = points[points.length - 1];
      var length = Math.hypot(wake[i].x - previous.x, wake[i].y - previous.y);
      if (length > 0.02 || i === wake.length - 1) {
        distance += length;
        points.push({ x: wake[i].x, y: wake[i].y, u: (i + 1) / wake.length, distance: distance });
      }
    }
    return distance > 0.6 ? points : [];
  }
  function drawWake(points, width, color, alpha) {
    if (points.length < 2) return;
    var totalDistance = points[points.length - 1].distance;
    function endFade(distance) {
      var t = Math.max(0, Math.min(1, (totalDistance - distance) / 70));
      return t * t * (3 - 2 * t);
    }
    var left = [], right = [];
    var normalX = 0, normalY = 1;
    for (var i = 0; i < points.length; i += 1) {
      var previous = points[Math.max(0, i - 1)];
      var next = points[Math.min(points.length - 1, i + 1)];
      var dx = next.x - previous.x, dy = next.y - previous.y;
      var length = Math.hypot(dx, dy);
      if (length > 0.001) {
        var nx = -dy / length, ny = dx / length;
        if (i && nx * normalX + ny * normalY < 0) { nx = -nx; ny = -ny; }
        normalX = nx;
        normalY = ny;
      }
      var radius = width * 0.5 * Math.pow(1 - points[i].u, 1.1) * scale.value;
      left.push({ x: points[i].x + normalX * radius, y: points[i].y + normalY * radius });
      right.push({ x: points[i].x - normalX * radius, y: points[i].y - normalY * radius });
    }
    function light(u, distance) {
      return 'rgba(' + color + ',' + alpha * Math.pow(Math.max(0, 1 - u), 1.5) * endFade(distance) + ')';
    }
    function boundary(edge, index) {
      if (index === 0) return edge[0];
      if (index === edge.length) return edge[edge.length - 1];
      return { x: (edge[index - 1].x + edge[index].x) / 2,
        y: (edge[index - 1].y + edge[index].y) / 2 };
    }
    function location(index) {
      if (index === 0) return points[0];
      if (index === points.length) return points[points.length - 1];
      var a = points[index - 1], b = points[index];
      return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2,
        u: (a.u + b.u) / 2, distance: (a.distance + b.distance) / 2 };
    }
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.max(0, Math.min(1, opacity.value));
    // Connected gradient ribbons have no particle caps or per-point blur.
    for (var from = 0; from < points.length;) {
      var to = Math.min(points.length, from + 4);
      var a = location(from), b = location(to);
      var gradient = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
      gradient.addColorStop(0, light(a.u, a.distance));
      gradient.addColorStop(0.5, light((a.u + b.u) / 2, (a.distance + b.distance) / 2));
      gradient.addColorStop(1, light(b.u, b.distance));
      ctx.fillStyle = gradient;
      ctx.beginPath();
      var start = boundary(left, from);
      ctx.moveTo(start.x, start.y);
      for (var j = from; j < to; j += 1) {
        var end = boundary(left, j + 1);
        ctx.quadraticCurveTo(left[j].x, left[j].y, end.x, end.y);
      }
      var tip = boundary(right, to);
      ctx.lineTo(tip.x, tip.y);
      for (var k = to - 1; k >= from; k -= 1) {
        var end = boundary(right, k);
        ctx.quadraticCurveTo(right[k].x, right[k].y, end.x, end.y);
      }
      ctx.closePath();
      ctx.fill();
      from = to;
    }
    ctx.restore();
  }
  function drawMeteor() {
    var points = wakeCurve();
    drawWake(points, 13, '255, 103, 36', 0.1);
    drawWake(points, 3.8, '255, 165, 76', 0.72);
    drawWake(points, 1.15, '255, 235, 202', 0.6);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = Math.max(0, Math.min(1, opacity.value));
    var radius = 19 * scale.value;
    var glow = ctx.createRadialGradient(x.value, y.value, 0, x.value, y.value, radius);
    glow.addColorStop(0, 'rgba(255, 243, 214, 0.95)');
    glow.addColorStop(0.13, 'rgba(255, 193, 104, 0.6)');
    glow.addColorStop(0.4, 'rgba(249, 115, 22, 0.15)');
    glow.addColorStop(1, 'rgba(249, 115, 22, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(x.value - radius, y.value - radius, radius * 2, radius * 2);
    ctx.fillStyle = '#fff3d6';
    ctx.beginPath();
    ctx.arc(x.value, y.value, 2.6 * scale.value, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  function draw(stamp) {
    raf = null;
    if (motionQuery.matches || document.hidden) { stop(); return; }
    var now = typeof stamp === 'number' ? stamp : performance.now();
    var dt = lastFrame ? Math.min(0.1, Math.max(0.001, (now - lastFrame) / 1000)) : 1 / 60;
    lastFrame = now;
    ctx.clearRect(0, 0, bounds.width, bounds.height);
    var keyboardMoving = advanceKeyboard(dt);
    if (!target) { lastFrame = 0; return; }
    var previousX = x.value, previousY = y.value;
    var movingX = advanceSpring(x, target.x, dt);
    var movingY = advanceSpring(y, target.y, dt);
    var fading = advanceSpring(opacity, active ? 1 : 0, dt);
    var scaling = advanceSpring(scale, active ? 1 : 0, dt);
    var wakeMoving = advanceWake(dt, previousX, previousY);
    if (opacity.value > 0.001 && scale.value > 0.001) {
      drawMeteor();
    }
    if (active) publish(true);
    if (keyboardMoving || movingX || movingY || fading || scaling || wakeMoving) schedule();
    else lastFrame = 0;
  }
  function handleMove(event) {
    if (motionQuery.matches || document.hidden || event.isPrimary === false) return;
    var point = event.touches ? event.touches[0] : event;
    if (!point) return;
    keys = {};
    keyboardVelocity.x = keyboardVelocity.y = 0;
    moveTarget(point.clientX - bounds.left, point.clientY - bounds.top);
  }
  function leave() {
    if (Object.keys(keys).length) return;
    keyboardVelocity.x = keyboardVelocity.y = 0;
    active = false;
    publish(false);
    schedule();
  }
  function interactiveTarget(element) {
    return element && element.closest && element.closest('a, button, input, textarea, select, [contenteditable="true"]');
  }
  window.addEventListener('keydown', function (event) {
    if (event.altKey || event.ctrlKey || event.metaKey || interactiveTarget(event.target) || motionQuery.matches) return;
    var key = event.code || event.key;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyW', 'KeyA', 'KeyS', 'KeyD'].indexOf(key) !== -1) {
      event.preventDefault();
      if (!target) {
        var start = lastPosition || { x: bounds.width / 2, y: bounds.height / 2 };
        moveTarget(Math.max(20, Math.min(bounds.width - 20, start.x)),
          Math.max(20, Math.min(bounds.height - 20, start.y)));
      }
      keys[key] = true;
      active = true;
      schedule();
    } else if (key === 'Space' && !event.repeat) {
      event.preventDefault();
      var point = target ? { x: x.value, y: y.value } :
        lastPosition || { x: bounds.width / 2, y: bounds.height / 2 };
      section.dispatchEvent(new CustomEvent('home-cursor-burst', { detail: point }));
    }
  });
  window.addEventListener('keyup', function (event) {
    delete keys[event.code || event.key];
    schedule();
  });
  resize();
  window.addEventListener('resize', resize, { passive: true });
  window.addEventListener('blur', stop);
  if ('PointerEvent' in window) {
    section.addEventListener('pointerenter', handleMove, { passive: true });
    section.addEventListener('pointermove', handleMove, { passive: true });
    section.addEventListener('pointerdown', handleMove, { passive: true });
    section.addEventListener('pointerleave', leave, { passive: true });
    section.addEventListener('pointercancel', leave, { passive: true });
    section.addEventListener('pointerup', function (event) { if (event.pointerType === 'touch') leave(); }, { passive: true });
  } else {
    section.addEventListener('touchmove', handleMove, { passive: true });
    section.addEventListener('touchstart', handleMove, { passive: true });
    section.addEventListener('touchend', leave, { passive: true });
    section.addEventListener('touchcancel', leave, { passive: true });
    section.addEventListener('mousemove', handleMove, { passive: true });
    section.addEventListener('mouseleave', leave, { passive: true });
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); });
  window.addEventListener('pagehide', stop);
  window.addEventListener('pageshow', resize);
  if (motionQuery.addEventListener) motionQuery.addEventListener('change', stop);
  else if (motionQuery.addListener) motionQuery.addListener(stop);
}());
</script>

<script src="{{ '/js/home-starsea.js' | relative_url }}"></script>
