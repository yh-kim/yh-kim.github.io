<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="html-document-listing" content="hidden">
  <meta name="description" content="파일을 업로드하지 않고 브라우저에서 여는 개인용 HTML Viewer">
  <meta name="theme-color" content="#111827">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HTML Viewer">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Pimi's Blog">
  <meta property="og:title" content="HTML Viewer · Pimi's Blog">
  <meta property="og:description" content="파일을 업로드하지 않고 브라우저에서 여는 개인용 HTML Viewer">
  <meta property="og:url" content="https://blog.pickth.com/p/hidden-memo/html-viewer/">
  <meta property="og:image" content="https://blog.pickth.com/img/og-image.png">
  <meta property="og:image:secure_url" content="https://blog.pickth.com/img/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Pimi's Blog space icon">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="HTML Viewer · Pimi's Blog">
  <meta name="twitter:description" content="파일을 업로드하지 않고 브라우저에서 여는 개인용 HTML Viewer">
  <meta name="twitter:image" content="https://blog.pickth.com/img/og-image.png">
  <title>HTML Viewer</title>
  <link rel="shortcut icon" href="/img/favicon.ico">
  <link rel="apple-touch-icon" href="../../../pwa/icons/400.jpg">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./app.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <main id="app" class="app-shell">
    <section id="empty-view" class="empty-view" aria-labelledby="app-title">
      <div class="empty-card">
        <div class="app-mark" aria-hidden="true"><span>&lt;/&gt;</span></div>
        <p class="eyebrow">LOCAL · PRIVATE · OFFLINE</p>
        <h1 id="app-title">HTML Viewer</h1>
        <p class="intro">iPhone의 파일 앱에서 HTML을 골라 웹페이지처럼 바로 확인하세요.</p>

        <button id="clipboard-button" class="primary-button shortcut-button" type="button" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 5h6m-6 0a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2m-6 0H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/></svg>
          단축어 HTML 열기
        </button>
        <p id="clipboard-hint" class="shortcut-hint" hidden>Safari의 클립보드 접근 안내가 나오면 허용해 주세요.</p>

        <label class="primary-button" for="html-file-input">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m0-12 4 4m-4-4L8 7M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
          HTML 파일 선택
        </label>
        <input id="html-file-input" class="file-input" type="file" accept=".html,.htm,text/html">

        <p id="empty-error" class="empty-error" role="alert" hidden></p>
        <div class="privacy-card">
          <span class="privacy-dot" aria-hidden="true"></span>
          <p><strong>업로드하지 않습니다.</strong> 선택하거나 단축어로 전달한 HTML은 이 기기에서만 읽습니다.</p>
        </div>
        <a class="memo-link" href="../">시크릿 메모로 돌아가기</a>
      </div>
    </section>

    <section id="viewer-view" class="viewer-view" aria-label="HTML 파일 뷰어" hidden>
      <header class="viewer-header">
        <div class="file-row">
          <div class="file-identity">
            <span class="file-badge" aria-hidden="true">HTML</span>
            <div>
              <p id="file-name" class="file-name">파일 없음</p>
              <p id="file-meta" class="file-meta"></p>
            </div>
          </div>
          <button id="close-button" class="icon-button close-button" type="button" aria-label="닫고 초기 화면으로 돌아가기">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <nav class="tool-row" aria-label="뷰어 도구">
          <button id="open-file-button" class="tool-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12m0-12 4 4m-4-4L8 7M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
            <span>새 파일</span>
          </button>
          <button id="reload-button" class="tool-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
            <span>새로고침</span>
          </button>
          <button id="render-button" class="tool-button is-active" type="button" aria-pressed="true">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
            <span>결과</span>
          </button>
          <button id="source-button" class="tool-button" type="button" aria-pressed="false">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8 8-4 4 4 4m8-8 4 4-4 4m-2-11-4 14"/></svg>
            <span>소스</span>
          </button>
        </nav>
      </header>

      <div id="notice" class="notice" role="status" hidden>
        <span class="notice-icon" aria-hidden="true">!</span>
        <p id="notice-text"></p>
        <button id="dismiss-notice" type="button" aria-label="안내 닫기">닫기</button>
      </div>

      <div id="render-panel" class="content-panel">
        <iframe
          id="render-frame"
          title="선택한 HTML 렌더링 결과"
          sandbox="allow-scripts allow-modals"
          referrerpolicy="no-referrer"
          allow="camera 'none'; microphone 'none'; geolocation 'none'; payment 'none'; usb 'none'"
        ></iframe>
      </div>

      <div id="source-panel" class="content-panel source-panel" hidden>
        <div class="source-head">
          <span>원본 소스</span>
          <button id="copy-button" type="button">복사</button>
        </div>
        <pre><code id="source-code"></code></pre>
      </div>

      <p id="live-status" class="visually-hidden" aria-live="polite"></p>
    </section>
  </main>

  <noscript>이 앱을 사용하려면 JavaScript를 활성화해야 합니다.</noscript>
</body>
</html>
